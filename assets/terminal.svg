<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="860" height="420" viewBox="0 0 860 420" role="img" aria-label="Terminal: whoami prints Sujit Shiravle, AI and full-stack developer; show-evals knowledgebot prints citation accuracy 15/15 (was 10/15), off-topic refusal 5/5 (was 4/5), red-team 10/10 (was 6/7), 3 bugs caught and fixed.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29389A"/>
      <stop offset="1" stop-color="#C5E654"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="76" height="26" width="0"><animate attributeName="width" from="0" to="420" begin="0.4s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="178" height="26" width="0"><animate attributeName="width" from="0" to="560" begin="2.8s" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 17px; white-space: pre; }
    .prompt { fill: #C5E654; }
    .path { fill: #7aa2ff; }
    .cmd { fill: #ffffff; }
    .out { fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .ok { fill: #3fb950; }
    .hl { fill: #C5E654; font-weight: 700; }
  </style>

  <!-- window -->
  <rect x="2" y="2" width="856" height="416" rx="14" fill="#0D1025" stroke="url(#glow)" stroke-width="2.5"/>
  <rect x="2" y="2" width="856" height="40" rx="14" fill="#161b33"/>
  <rect x="2" y="30" width="856" height="12" fill="#161b33"/>
  <circle cx="28" cy="22" r="7" fill="#ff5f57"/><circle cx="50" cy="22" r="7" fill="#febc2e"/><circle cx="72" cy="22" r="7" fill="#28c840"/>
  <text x="430" y="27" text-anchor="middle" class="mono dim" style="font-size:14px">sujit@spark: ~</text>

  <!-- $ whoami -->
  <text x="40" y="96" class="mono" clip-path="url(#c1)"><tspan class="prompt">sujit@spark</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">whoami</tspan></text>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/>
    <text x="40" y="128" class="mono out">Sujit Shiravle · AI &amp; full-stack developer · B.Tech AI &amp; DS '27</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.3s" fill="freeze"/>
    <text x="40" y="154" class="mono dim">→ builds LLM apps, then proves they work</text>
  </g>

  <!-- $ show-evals knowledgebot -->
  <text x="40" y="198" class="mono" clip-path="url(#c2)"><tspan class="prompt">sujit@spark</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan><tspan class="cmd">show-evals knowledgebot</tspan></text>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.25s" fill="freeze"/>
    <text x="40" y="232" class="mono out">retrieval_hit@5    <tspan class="dim">.........</tspan> 15/15  <tspan class="ok">✓</tspan></text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.25s" fill="freeze"/>
    <text x="40" y="258" class="mono out">citation_accuracy  <tspan class="dim">.........</tspan> 15/15  <tspan class="ok">✓</tspan>  <tspan class="dim">(was 10/15)</tspan></text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.25s" fill="freeze"/>
    <text x="40" y="284" class="mono out">off_topic_refusal  <tspan class="dim">.........</tspan>  5/5   <tspan class="ok">✓</tspan>  <tspan class="dim">(was 4/5)</tspan></text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.25s" fill="freeze"/>
    <text x="40" y="310" class="mono out">red_team_attacks   <tspan class="dim">.........</tspan> 10/10  <tspan class="ok">✓</tspan>  <tspan class="dim">(was 6/7, incl. 4 unseen)</tspan></text>
  </g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.1s" dur="0.4s" fill="freeze"/>
    <text x="40" y="346" class="mono hl">3 bugs caught → 3 fixed → 3 regression tests</text>
  </g>

  <!-- final prompt + blinking cursor -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.8s" dur="0.2s" fill="freeze"/>
    <text x="40" y="386" class="mono"><tspan class="prompt">sujit@spark</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$ </tspan></text>
    <rect x="196" y="371" width="10" height="20" fill="#C5E654">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="6.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
